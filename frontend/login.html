<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CineRank - Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                🎬 CineRank
            </div>

            <h1>Welcome back</h1>

            <p class="subtitle">
                Sign in to get personalized movie recommendations.
            </p>

            <form id="loginForm">

                <input
                    type="email"
                    id="email"
                    placeholder="Email address"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p id="message"></p>

            <p class="register-text">
                Don't have an account?
                <a href="#" onclick="showRegister()">
                    Create one
                </a>
            </p>

        </div>

    </div>

    <script src="login.js"></script>

</body>

</html>
