<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        CineRank - Create Account
    </title>

    <link
        rel="stylesheet"
        href="register.css"
    >

</head>

<body>

    <div class="register-container">

        <div class="register-card">

            <div class="logo">
                🎬 CineRank
            </div>

            <h1>
                Create your account
            </h1>

            <p class="subtitle">
                Join CineRank and get personalized movie recommendations.
            </p>


            <form id="registerForm">

                <input
                    type="text"
                    id="name"
                    placeholder="Full name"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email address"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    required
                >

                <button type="submit">
                    Create Account
                </button>

            </form>


            <p id="message"></p>


            <p class="login-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>


    <script src="register.js"></script>

</body>

</html>
